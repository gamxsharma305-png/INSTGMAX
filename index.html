<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://arolinks.com https://*.arolinks.com https://auth.pwasmultiverse.workers.dev https://*.upstash.io https://*.vercel.app; object-src 'none'; frame-ancestors 'none'">
<title>GMAX Hub</title>
<style>
:root{--bg:#12081C;--card:#1a0f28;--line:#3d2a55;--text:#f3e8ff;--muted:#a78bfa;--accent:#C4A1FF;--pink:#e879f9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(18,8,28,.92);backdrop-filter:blur(12px);z-index:10}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--pink));display:grid;place-items:center;font-weight:800;color:#1a0a2a;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stories{display:flex;gap:12px;padding:14px;overflow-x:auto}
.story{text-align:center;font-size:11px;color:var(--muted);min-width:64px}
.story .ring{width:56px;height:56px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;margin:0 auto 4px}
.feed.locked .post-media,.feed.locked .caption{filter:blur(42px) brightness(.25);pointer-events:none}
.post{margin:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.post-head{display:flex;gap:10px;align-items:center;padding:10px 12px}
.post-av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#1a0a2a;display:grid;place-items:center;font-weight:700;overflow:hidden}
.post-av img{width:100%;height:100%;object-fit:cover}
.post-media{min-height:240px;background:#0a0612;position:relative;display:grid;place-items:center}
.post-media img,.post-media video{width:100%;max-height:420px;object-fit:cover}
.caption{padding:10px 12px;font-size:14px}
.lock-banner{display:none;text-align:center;padding:16px;margin:12px;border:1px solid var(--line);border-radius:14px;background:rgba(18,8,28,.8)}
.feed.locked .lock-banner{display:block}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--pink));color:#1a0a2a}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(18,8,28,.95);border-top:1px solid var(--line);padding:8px;gap:8px;justify-content:space-around}
.tab{flex:1;padding:10px;border:0;background:transparent;color:var(--muted);font-weight:600}
.tab.active{color:var(--accent)}
.screen{display:none;padding-bottom:80px}
.screen.active{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;z-index:50}
.modal.show{display:flex}
.modal-box{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:20px}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f0818;color:var(--text);margin:6px 0 12px}
.err{color:#f87171;font-size:13px;min-height:18px}
.ok{color:#86efac;font-size:13px}
.admin-box{margin:12px;padding:14px;border:1px solid var(--line);border-radius:14px}
label{font-size:12px;color:var(--muted);display:block}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo" id="brandLogo">G</div><div><strong id="brandName">GMAX Hub</strong><div style="font-size:11px;color:var(--muted)" id="brandTag">Study feed</div></div></div>
  <div style="display:flex;gap:8px;align-items:center"><span class="chip" id="timerChip" style="display:none">⏱ <span id="timerVal"></span></span>
  <button class="btn btn-ghost" type="button" id="btnUnlockTop">🔒</button></div>
</div>
<section class="screen active" id="screenHome">
  <div class="stories" id="storiesRow"></div>
  <div class="feed locked" id="feed">
    <div class="lock-banner"><div>🔒 Content locked</div><button class="btn btn-primary" type="button" id="btnOpenUnlock" style="margin-top:10px">Unlock · 36 hours</button></div>
    <div id="posts"></div>
  </div>
</section>
<section class="screen" id="screenAbout"><div id="aboutDeck" style="padding:16px"></div></section>
<section class="screen" id="screenAdmin" style="padding:16px">
  <h2>Admin</h2>
  <div id="adminLoginBox" class="admin-box">
    <label>Admin PIN</label>
    <input type="password" id="adminPin"/>
    <button class="btn btn-primary" type="button" id="adminLoginBtn" style="width:100%">Login</button>
    <div class="err" id="adminErr"></div>
  </div>
  <div id="adminDash" style="display:none">
    <div class="admin-box">
      <label>Site name</label><input id="brandNameInput"/>
      <label>Logo image URL</label><input id="brandLogoInput" type="url"/>
      <label>Default avatar URL</label><input id="brandAvatarInput" type="url"/>
    </div>
    <div class="admin-box">
      <strong>Add Post</strong>
      <label>Username</label><input id="apUser" value="Gmax"/>
      <label>Avatar URL</label><input id="apAvatar" type="url"/>
      <label>Title</label><input id="apTitle"/>
      <label>Caption</label><textarea id="apCaption"></textarea>
      <label>Media URL (https)</label><input id="apMedia" type="url"/>
      <button class="btn btn-primary" type="button" id="apAdd" style="width:100%">Add post</button>
    </div>
    <div class="admin-box">
      <div id="adminList"></div>
      <button class="btn btn-primary" type="button" id="adminPublishAll" style="width:100%;margin-top:8px">Publish to all users</button>
      <div class="err" id="publishErr"></div>
      <button class="btn btn-ghost" type="button" id="adminLogout" style="width:100%;margin-top:8px">Logout</button>
    </div>
  </div>
</section>
<nav class="tabs">
  <button class="tab active" data-tab="home" type="button">Home</button>
  <button class="tab" data-tab="about" type="button">About</button>
  <button class="tab" data-tab="admin" type="button">Admin</button>
</nav>
<div class="modal" id="unlockModal">
  <div class="modal-box">
    <h3>Unlock</h3>
    <p style="font-size:13px;color:var(--muted);margin:8px 0">Get Key → 12-digit code → Verify (36 hours)</p>
    <input id="pwInput" inputmode="numeric" placeholder="12-digit code"/>
    <div class="err" id="pwErr"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" type="button" id="pwGetKeyBtn">Get Key</button>
      <button class="btn btn-primary" type="button" id="pwSubmit">Verify</button>
      <button class="btn btn-ghost" type="button" id="pwClose">Close</button>
    </div>
  </div>
</div>
<script>
(function(){
  const KEY='lumina_unlock_until', UNLOCK_TOKEN_KEY='lumina_unlock_token', DEVICE_KEY='lumina_device_id', ADMIN_KEY='lumina_admin_until';
  let sharedPosts=[], sharedStories=[], sharedBrand={name:'GMAX Hub',tag:'Study feed',logo:'',avatar:''};
  let contentFromServer=false, adminPinSession='';
  function getUntil(){try{return parseInt(localStorage.getItem(KEY)||'0',10)||0}catch(e){return 0}}
  function setUntil(t){try{localStorage.setItem(KEY,String(t))}catch(e){}}
  function getUnlockToken(){try{return localStorage.getItem(UNLOCK_TOKEN_KEY)||''}catch(e){return ''}}
  function setUnlockToken(t){try{if(t)localStorage.setItem(UNLOCK_TOKEN_KEY,t);else localStorage.removeItem(UNLOCK_TOKEN_KEY)}catch(e){}}
  function isUnlockedNow(){return getUntil()>Date.now()&&!!getUnlockToken()}
  function getDeviceId(){
    try{let id=localStorage.getItem(DEVICE_KEY);if(id&&/^[A-Z0-9]{4,8}$/.test(id))return id;
      const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';id='';
      for(let i=0;i<6;i++)id+=c[Math.floor(Math.random()*c.length)];
      localStorage.setItem(DEVICE_KEY,id);return id}catch(e){return 'DEVICE1'}
  }
  function applyUnlockState(){
    const ok=getUntil()>Date.now();
    document.getElementById('feed').classList.toggle('locked',!ok);
    const chip=document.getElementById('timerChip');
    if(ok){chip.style.display='inline-flex';
      const tick=()=>{const left=getUntil()-Date.now();if(left<=0){localStorage.removeItem(KEY);localStorage.removeItem(UNLOCK_TOKEN_KEY);applyUnlockState();loadSharedContent();return}
        const s=Math.floor(left/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
        document.getElementById('timerVal').textContent=[h,m,sec].map(n=>String(n).padStart(2,'0')).join(':');
        setTimeout(tick,1000)};tick();
    } else chip.style.display='none';
  }
  function mediaBlock(url,title){
    if(!isUnlockedNow()||!url){
      return '<div class="post-media"><div style="text-align:center;padding:40px"><div style="font-size:28px">🔒</div><div>Protected</div><div style="font-weight:700;margin-top:6px">'+(title||'Post').replace(/</g,'').slice(0,40)+'</div></div></div>';
    }
    if(/\.(mp4|webm)(\?|$)/i.test(url)) return '<div class="post-media"><video src="'+url.replace(/"/g,'')+'" playsinline muted loop autoplay></video></div>';
    return '<div class="post-media"><img src="'+url.replace(/"/g,'')+'" alt="" draggable="false"/></div>';
  }
  function renderPosts(){
    const el=document.getElementById('posts');
    const posts=sharedPosts||[];
    if(!posts.length){el.innerHTML='<p style="padding:16px;color:var(--muted)">No posts yet</p>';return}
    el.innerHTML=posts.map(p=>{
      const av=(isUnlockedNow()&&(p.avatar||sharedBrand.avatar))?'<img src="'+String(p.avatar||sharedBrand.avatar).replace(/"/g,'')+'" alt=""/>':(p.user||'G')[0].toUpperCase();
      return '<article class="post"><div class="post-head"><div class="post-av">'+av+'</div><div><strong>'+(p.user||'')+'</strong><div style="font-size:11px;color:var(--muted)">'+(p.place||'')+'</div></div></div>'
        +mediaBlock(p.media,p.title)+'<div class="caption"><strong>'+(p.user||'')+'</strong> '+(p.caption||'')+'</div></article>';
    }).join('');
  }
  function renderStories(){
    const row=document.getElementById('storiesRow');
    const stories=sharedStories||[];
    row.innerHTML=(stories.length?stories:[{name:'Tips'},{name:'Math'},{name:'Science'}]).map(s=>
      '<div class="story"><div class="ring">'+(s.name||'S')[0]+'</div>'+(s.name||'')+'</div>').join('');
  }
  function applyBrand(){
    document.getElementById('brandName').textContent=sharedBrand.name||'GMAX Hub';
    document.getElementById('brandTag').textContent=sharedBrand.tag||'';
    const logo=document.getElementById('brandLogo');
    if(sharedBrand.logo&&isUnlockedNow()) logo.innerHTML='<img src="'+sharedBrand.logo.replace(/"/g,'')+'" alt=""/>';
    else logo.textContent=(sharedBrand.name||'G')[0];
    const ni=document.getElementById('brandNameInput'); if(ni&&!ni.value) ni.value=sharedBrand.name||'';
    const li=document.getElementById('brandLogoInput'); if(li) li.value=sharedBrand.logo||'';
    const ai=document.getElementById('brandAvatarInput'); if(ai) ai.value=sharedBrand.avatar||'';
  }
  function renderAdminList(){
    const box=document.getElementById('adminList');
    if(!sharedPosts.length){box.innerHTML='<em style="color:var(--muted)">No posts — add then Publish</em>';return}
    box.innerHTML=sharedPosts.map(p=>'<div style="display:flex;justify-content:space-between;margin:6px 0"><span>🖼 '+(p.title||'')+'</span><button type="button" data-del="'+p.id+'" style="color:#f87171;background:0;border:0">del</button></div>').join('');
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{sharedPosts=sharedPosts.filter(p=>p.id!==b.getAttribute('data-del'));renderAdminList();renderPosts()});
  }
  function refreshAll(){applyBrand();renderStories();renderPosts();renderAdminList()}
  async function loadSharedContent(){
    try{
      const tok=getUnlockToken();
      const unlocked=getUntil()>Date.now()&&tok;
      const headers={}; if(unlocked) headers['x-unlock-token']=tok;
      const r=await fetch('/api/content?t='+Date.now()+(unlocked?'&token='+encodeURIComponent(tok):''),{cache:'no-store',headers});
      const d=await r.json();
      if(d&&d.ok&&d.content){
        contentFromServer=true;
        sharedPosts=Array.isArray(d.content.posts)?d.content.posts:[];
        sharedStories=Array.isArray(d.content.stories)?d.content.stories:[];
        if(d.content.brand) sharedBrand=Object.assign(sharedBrand,d.content.brand);
      }
    }catch(e){}
    refreshAll();
  }
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.onclick=()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
      document.getElementById({home:'screenHome',about:'screenAbout',admin:'screenAdmin'}[tab.dataset.tab]).classList.add('active');
      if(tab.dataset.tab==='admin') showAdmin();
    };
  });
  const modal=document.getElementById('unlockModal');
  function openUnlock(){modal.classList.add('show')}
  function closeUnlock(){modal.classList.remove('show')}
  document.getElementById('btnOpenUnlock').onclick=openUnlock;
  document.getElementById('btnUnlockTop').onclick=openUnlock;
  document.getElementById('pwClose').onclick=closeUnlock;
  document.getElementById('pwSubmit').onclick=async()=>{
    const val=(document.getElementById('pwInput').value||'').trim().replace(/\s+/g,'');
    const err=document.getElementById('pwErr');
    if(!/^\d{12}$/.test(val)){err.textContent='12-digit code';return}
    err.textContent='';
    try{
      const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:val,deviceId:getDeviceId()})});
      const d=await r.json();
      if(d.ok&&d.until){setUntil(d.until);if(d.unlockToken)setUnlockToken(d.unlockToken);applyUnlockState();closeUnlock();loadSharedContent()}
      else err.textContent=d.error||'Invalid';
    }catch(e){err.textContent='Network error'}
  };
  document.getElementById('pwGetKeyBtn').onclick=async()=>{
    try{
      const r=await fetch('/api/get-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:getDeviceId()})});
      const d=await r.json();
      const url=d&& (d.shortUrl||d.fallbackUrl);
      if(url) location.href=url; else document.getElementById('pwErr').textContent=d.error||'Key failed';
    }catch(e){document.getElementById('pwErr').textContent='Network error'}
  };
  function adminOk(){try{return parseInt(localStorage.getItem(ADMIN_KEY)||'0',10)>Date.now()}catch(e){return false}}
  function showAdmin(){
    const ok=adminOk();
    document.getElementById('adminLoginBox').style.display=ok?'none':'block';
    document.getElementById('adminDash').style.display=ok?'block':'none';
    if(ok) renderAdminList();
  }
  document.getElementById('adminLoginBtn').onclick=async()=>{
    const pin=document.getElementById('adminPin').value||'';
    const err=document.getElementById('adminErr');err.textContent='';
    try{
      const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
      const d=await r.json();
      if(d.ok&&d.until){localStorage.setItem(ADMIN_KEY,String(d.until));adminPinSession=pin;showAdmin()}
      else err.textContent=d.error||'Login failed';
    }catch(e){err.textContent='Network error'}
  };
  document.getElementById('adminLogout').onclick=()=>{localStorage.removeItem(ADMIN_KEY);adminPinSession='';showAdmin()};
  document.getElementById('apAdd').onclick=()=>{
    const user=(document.getElementById('apUser').value||'Gmax').trim();
    const avatar=(document.getElementById('apAvatar').value||sharedBrand.avatar||'').trim();
    const title=(document.getElementById('apTitle').value||'').trim();
    const caption=(document.getElementById('apCaption').value||'').trim();
    const media=(document.getElementById('apMedia').value||'').trim();
    if(!title&&!caption&&!media){alert('Title/caption/media bharo');return}
    if(media&&!/^https?:\/\//i.test(media)){alert('Media https:// se');return}
    sharedPosts.unshift({id:'c'+Date.now(),user,avatar,title:title||'Post',caption,media,likes:0,time:'JUST NOW',place:'Feed'});
    document.getElementById('apTitle').value='';document.getElementById('apCaption').value='';document.getElementById('apMedia').value='';
    refreshAll();
    alert('Draft ready — Publish dabao');
  };
  document.getElementById('adminPublishAll').onclick=async()=>{
    const err=document.getElementById('publishErr');err.textContent='';err.className='err';
    if(!adminPinSession){const pin=prompt('Admin PIN:');if(!pin)return;adminPinSession=pin}
    sharedBrand={name:document.getElementById('brandNameInput').value||sharedBrand.name,tag:sharedBrand.tag,logo:document.getElementById('brandLogoInput').value||'',avatar:document.getElementById('brandAvatarInput').value||''};
    try{
      const r=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:adminPinSession,posts:sharedPosts,stories:sharedStories,brand:sharedBrand})});
      const d=await r.json();
      if(!r.ok||!d.ok){err.textContent=d.error||('Fail '+r.status);if(r.status===401)adminPinSession='';return}
      sharedPosts=d.content&&d.content.posts||sharedPosts;
      err.className='ok';
      err.textContent='Published · posts='+(d.counts&&d.counts.posts!=null?d.counts.posts:sharedPosts.length);
      refreshAll();
    }catch(e){err.textContent='Network error'}
  };
  document.addEventListener('contextmenu',e=>e.preventDefault(),true);
  document.addEventListener('keydown',e=>{
    const k=e.key||'',c=e.ctrlKey||e.metaKey,s=e.shiftKey;
    if(k==='F12'||(c&&['u','s'].includes(k.toLowerCase()))||(c&&s&&['i','j','c'].includes(k.toLowerCase()))){e.preventDefault()}
  },true);
  applyUnlockState();
  showAdmin();
  loadSharedContent();
})();
</script>
</body>
</html>
